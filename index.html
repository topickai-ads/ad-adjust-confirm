.seg button.on{background:var(--chip);color:var(--text);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}

.btn.warn{background:#422006;border-color:#854d0e;color:#fde68a}

table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;z-index:1}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}

.prod{display:inline-flex;align-items:center;gap:6px;font-weight:700}

      "adset": "新开 ABO · camp ZT4_A-PUR-US-All-1103 / adset Starriva-All-28-55-1103-US-T1（整户首条）",
      "action": "新开测仓",
      "detail": "【可选/不催】日预算 $80–$100；国家 US；AEO 购；可挂 EN-Starriva-27 副本或 1015-英语-10；ST-ZT2 当前空仓",
      "why": "看数：ST-ZT2 campaigns=0、今日/7天 $0；Star 美国自投目前只在 ST-ZT1\n结论：可选空仓首测——Billy 节奏上不催 Star 美国整户铺开\n动作：若问「为什么不新开」可开第一条薄测；默认不催、优先级低；优先把 ST-ZT1 测仓跑顺",
      "status": "pending"
    }
  ]
};
</script>
<script src="actions.snapshot.js" onerror="/* inline snapshot already present */"></script>
<script>
(function(){
const PASS='hebin';
const AK='ad_adjust_ak', TTL=7*24*3600*1000;
const HOOK_KEY='ad_adjust_hook', HK_KEY='ad_adjust_hk';
const state={product:'self', prio:'must', selected:new Set()};

function saveAk(pw){localStorage.setItem(AK, JSON.stringify({v:pw, exp:Date.now()+TTL}));}
function loadAk(){
  try{
    const raw=localStorage.getItem(AK); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||!o.v||!o.exp||Date.now()>o.exp){localStorage.removeItem(AK); return null;}
    return o.v;
  }catch(e){localStorage.removeItem(AK); return null;}
}
function stripParams(){
  try{
    const u=new URL(location.href);
    let dirty=false;
    const hook=u.searchParams.get('hook');
    const hk=u.searchParams.get('hk');
    const access=u.searchParams.get('access_key') || u.searchParams.get('k');
    if(hook){ localStorage.setItem(HOOK_KEY, hook); u.searchParams.delete('hook'); dirty=true; }
    if(hk){ localStorage.setItem(HK_KEY, hk); u.searchParams.delete('hk'); dirty=true; }
    if(access){
      if(access===PASS){ saveAk(access); }
      u.searchParams.delete('access_key'); u.searchParams.delete('k'); dirty=true;
    }
    if(dirty) history.replaceState(null,'', u.pathname + (u.search||'') + (u.hash||''));
  }catch(e){}
}
function getHook(){
  const url=(localStorage.getItem(HOOK_KEY)||'').trim();
  const hk=(localStorage.getItem(HK_KEY)||'').trim();
  return {url, hk};
}
function showBanner(type, text){
  const el=document.getElementById('banner');
  el.className='banner show '+type;
  el.textContent=text;
}
function clearBanner(){
  const el=document.getElementById('banner');
  el.className='banner';
  el.textContent='';
}
function data(){
  const snap=window.ACTIONS_SNAPSHOT;
  if(!snap || !Array.isArray(snap.actions)) throw new Error('缺少 ACTIONS_SNAPSHOT');
  return snap;
}
function isMust(a){ return a.priority==='今晚必做'; }
function isLater(a){ return a.priority==='可明早再看'; }
function isNote(a){ return a.priority==='备注' || a.action==='不动' || a.priority==='不动'; }
function defaultChecked(a){ return isMust(a) && !isNote(a); }
function disabledRow(a){ return isNote(a); }
function visible(a){
  if(state.product==='Mera' && a.product!=='Mera') return false;
  if(state.product==='Star' && a.product!=='Star') return false;
  if(state.product==='self' && !a.self_serve) return false;
  if(state.prio==='must' && !isMust(a)) return false;
  if(state.prio==='later' && !isLater(a)) return false;
  return true;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function updateCfg(){
  const {url,hk}=getHook();
  const box=document.getElementById('cfgBox');
  const ready=!!url;
  const btns=['btnConfirmSelected','btnConfirmMust','btnConfirmSelf','btnCancel'];
  btns.forEach(id=>{
    const b=document.getElementById(id);
    b.disabled=!ready;
  });
  if(ready){
    box.innerHTML='Webhook 已配置（仅本机 localStorage）。URL/密钥不回显。'
      + ' 可用下方表单或 <code>?hook=</code> / <code>?hk=</code> 覆盖。'
      + (hk?' Authorization: Bearer 已启用。':' 未配置 Sender key，将不带 Authorization。')
      + '<div class="cfg-form" style="margin-top:10px">'
      + '<div class="row">'
      + '<div class="field"><label for="hookUrlInput">Webhook URL</label>'
      + '<input id="hookUrlInput" type="url" autocomplete="off" spellcheck="false" placeholder="https://api2.cursor.sh/automations/webhook/07658f8a-f045-5847-8332-99ad2670918a" value=""></div>'
      + '<div class="field"><label for="hookHkInput">Sender key</label>'
      + '<input id="hookHkInput" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 sender key（不会写入仓库）" value=""></div>'
      + '<button class="btn" type="button" id="btnSaveHook">保存到本机</button>'
      + '</div></div>';
    const btn=document.getElementById('btnSaveHook');
    if(btn) btn.onclick=saveHookForm;
  }else{
    box.innerHTML='<div><b>未配置 webhook</b>：确认按钮已禁用。请在下方填写后点「保存到本机」（写入 localStorage <code>ad_adjust_hook</code> / <code>ad_adjust_hk</code>），或用一次 <code>?hook=</code>&amp;<code>?hk=</code> 链接。</div>'
      + '<div class="cfg-form">'
      + '<div class="row">'
      + '<div class="field"><label for="hookUrlInput">Webhook URL</label>'
      + '<input id="hookUrlInput" type="url" autocomplete="off" spellcheck="false" placeholder="https://api2.cursor.sh/automations/webhook/07658f8a-f045-5847-8332-99ad2670918a" value=""></div>'
      + '<div class="field"><label for="hookHkInput">Sender key</label>'
      + '<input id="hookHkInput" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 sender key（不会写入仓库）" value=""></div>'
      + '<button class="btn primary" type="button" id="btnSaveHook">保存到本机</button>'
      + '</div>'
      + '<div style="color:var(--muted)">密钥永不进仓库/HTML/默认值；保存后会清掉地址栏参数并去掉蓝条、启用确认按钮。</div>'
      + '</div>';
    const btn=document.getElementById('btnSaveHook');
    if(btn) btn.onclick=saveHookForm;
  }
}
function saveHookForm(){
  const urlEl=document.getElementById('hookUrlInput');
  const hkEl=document.getElementById('hookHkInput');
  const url=(urlEl && urlEl.value || '').trim();
  const hk=(hkEl && hkEl.value || '').trim();
  if(!url){
    showBanner('err','请先填写 Webhook URL');
    return;
  }
  try{
    const u=new URL(url);
    if(u.protocol!=='https:' && u.protocol!=='http:'){
      showBanner('err','Webhook URL 需要 http(s)');
      return;
    }
  }catch(e){
    showBanner('err','Webhook URL 格式不对');
    return;
  }
  localStorage.setItem(HOOK_KEY, url);
  if(hk) localStorage.setItem(HK_KEY, hk);
  else localStorage.removeItem(HK_KEY);
  try{
    const loc=new URL(location.href);
    loc.searchParams.delete('hook');
    loc.searchParams.delete('hk');
    history.replaceState(null,'', loc.pathname + (loc.search||'') + (loc.hash||''));
  }catch(e){}
  clearBanner();
  showBanner('ok','已保存到本机 localStorage。确认按钮已启用。');
  updateCfg();
}
function renderStats(list){
  const all=data().actions;
  const must=all.filter(isMust).length;
  const ss=all.filter(a=>a.self_serve).length;
  const checked=[...state.selected].length;
  document.getElementById('stats').innerHTML=[
    `<span class="chip">批次 <b>${esc(data().batch_id)}</b></span>`,
    `<span class="chip">总条数 <b>${all.length}</b></span>`,
    `<span class="chip">今晚必做 <b>${must}</b></span>`,
    `<span class="chip">自投 <b>${ss}</b></span>`,
    `<span class="chip">当前筛选 <b>${list.length}</b></span>`,
    `<span class="chip">已勾选 <b>${checked}</b></span>`,
  ].join('');
}
function render(){
  const list=data().actions.filter(visible);
  const tb=document.getElementById('tbody');
  tb.innerHTML=list.map(a=>{
    const dis=disabledRow(a);
    const checked=state.selected.has(a.id);
    const prioCls=isMust(a)?'must':(isLater(a)?'later':'note');
    const own=a.self_serve?'ss':'ag';
    return `<tr class="${dis?'disabled':''}" data-id="${esc(a.id)}">
      <td><input class="check row-check" type="checkbox" data-id="${esc(a.id)}" ${checked?'checked':''} ${dis?'disabled':''}></td>
      <td><span class="prod">${esc(a.product)}</span> <span class="badge ${own}">${a.self_serve?'自投':'代理'}</span></td>
      <td>${esc(a.account)}</td>
      <td>${esc(a.adset)}</td>
      <td><b>${esc(a.action)}</b></td>
      <td class="detail">${esc(a.detail)}</td>
      <td><span class="badge ${prioCls}">${esc(a.priority)}</span></td>
      <td class="why">${esc(a.why)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="color:var(--muted);padding:24px">没有匹配的行</td></tr>`;
  renderStats(list);
  updateCfg();
  const visEnabled=list.filter(a=>!disabledRow(a));
  const allOn=visEnabled.length>0 && visEnabled.every(a=>state.selected.has(a.id));
  document.getElementById('checkAll').checked=allOn;
  document.getElementById('checkAll').indeterminate=!allOn && visEnabled.some(a=>state.selected.has(a.id));
}
async function postWebhook(body){
  const {url,hk}=getHook();
  if(!url) throw new Error('未配置 webhook（localStorage ad_adjust_hook）');
  const headers={'Content-Type':'application/json'};
  if(hk) headers['Authorization']='Bearer '+hk;
  let r;
  try{
    r=await fetch(url,{method:'POST', mode:'cors', headers, body:JSON.stringify(body)});
  }catch(err){
    throw new Error('CORS/网络失败：'+ (err && err.message ? err.message : String(err)) + '（不会用 no-cors 假装成功）');
  }
  if(!(r.ok || r.status===202 || r.status===204)){
    const t=await r.text().catch(()=> '');
    throw new Error('Webhook HTTP '+r.status+(t?(' · '+t.slice(0,180)):''));
  }
  return r.status;
}
function note(){ return (document.getElementById('noteInput').value||'').trim(); }
function setBusy(b){
  ['btnConfirmSelected','btnConfirmMust','btnConfirmSelf','btnCancel'].forEach(id=>{
    const el=document.getElementById(id);
    if(!getHook().url){ el.disabled=true; return; }
    el.disabled=b;
  });
}
async function confirmSelected(){
  const ids=[...state.selected];
  if(!ids.length){ showBanner('err','请先勾选要执行的项'); return; }
  await doPost({action:'confirm', batch_id:data().batch_id, scope:'selected', selected_ids:ids, note:note()});
}
async function confirmMust(){
  const ids=data().actions.filter(a=>isMust(a) && !disabledRow(a)).map(a=>a.id);
  await doPost({action:'confirm', batch_id:data().batch_id, scope:'all_must', selected_ids:ids, note:note()});
}
async function confirmSelf(){
  const ids=data().actions.filter(a=>a.self_serve && !disabledRow(a)).map(a=>a.id);
  // Prefer currently selected self-serve if any, else all self-serve actionable
  const selectedSelf=[...state.selected].filter(id=>{
    const a=data().actions.find(x=>x.id===id); return a && a.self_serve && !disabledRow(a);
  });
  await doPost({action:'confirm', batch_id:data().batch_id, scope:'self_serve_only', selected_ids: selectedSelf.length?selectedSelf:ids, note:note()});
}
async function cancelAll(){
  await doPost({action:'cancel', batch_id:data().batch_id, scope:'none', selected_ids:[], note:note()});
}
async function doPost(body){
  clearBanner();
  setBusy(true);
  showBanner('info','正在提交…');
  try{
    const status=await postWebhook(body);
    showBanner('ok','已提交（HTTP '+status+'）。请等 UG 在聊天回报调整前/后。不要重复狂点。');
  }catch(e){
    showBanner('err', e.message || String(e));
  }finally{
    setBusy(false);
    updateCfg();
  }
}
function bind(){
  document.getElementById('productSeg').addEventListener('click', e=>{
    const b=e.target.closest('button[data-v]'); if(!b) return;
    state.product=b.dataset.v;
    [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  document.getElementById('prioSeg').addEventListener('click', e=>{
    const b=e.target.closest('button[data-v]'); if(!b) return;
    state.prio=b.dataset.v;
    [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  document.getElementById('tbody').addEventListener('change', e=>{
    const t=e.target; if(!t.classList.contains('row-check')) return;
    if(t.checked) state.selected.add(t.dataset.id); else state.selected.delete(t.dataset.id);
    renderStats(data().actions.filter(visible));
    updateCfg();
    const list=data().actions.filter(visible).filter(a=>!disabledRow(a));
    const allOn=list.length>0 && list.every(a=>state.selected.has(a.id));
    document.getElementById('checkAll').checked=allOn;
    document.getElementById('checkAll').indeterminate=!allOn && list.some(a=>state.selected.has(a.id));
  });
  document.getElementById('checkAll').addEventListener('change', e=>{
    const list=data().actions.filter(visible).filter(a=>!disabledRow(a));
    if(e.target.checked) list.forEach(a=>state.selected.add(a.id));
    else list.forEach(a=>state.selected.delete(a.id));
    render();
  });
  document.getElementById('btnConfirmSelected').onclick=confirmSelected;
  document.getElementById('btnConfirmMust').onclick=confirmMust;
  document.getElementById('btnConfirmSelf').onclick=confirmSelf;
  document.getElementById('btnCancel').onclick=cancelAll;
}
function bootApp(){
  const snap=data();
  document.getElementById('batchMeta').textContent = snap.batch_id + ' · ' + (snap.title||'');
  snap.actions.forEach(a=>{ if(defaultChecked(a)) state.selected.add(a.id); });
  bind();
  render();
  if(!getHook().url){
    showBanner('info','未配置 webhook：确认按钮已禁用。请用下方表单「保存到本机」，或用 ?hook= 与 ?hk= 一次写入。');
  }
}
function openGate(){
  document.getElementById('gate').hidden=false;
  document.getElementById('app').hidden=true;
}
function openApp(){
  document.getElementById('gate').hidden=true;
  document.getElementById('app').hidden=false;
  bootApp();
}
stripParams();
document.getElementById('gateForm').addEventListener('submit', e=>{
  e.preventDefault();
  const v=(document.getElementById('gateKey').value||'').trim();
  if(v!==PASS){
    document.getElementById('gateErr').textContent='口令不对';
    return;
  }
  saveAk(v);
  openApp();
});
if(loadAk()===PASS) openApp();
else openGate();
})();
</script>
</body>
